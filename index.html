function subscribeTenantPortal(email){
  unsub();
  var f=fb(); var db=f.db; var col=f.collection; var snap=f.onSnapshot; var q=f.query;
  var p=pid(email);
  _unsubs.push(snap(q(col(db,'tenantProfiles')),function(s){

        subscribeManagerData(S.tenantProfile.landlordUid,S.tenantProfile.assignedProperties||[]);
        subscribeWorkerShifts(S.tenantProfile);
          subscribeWorkerBudget(S.tenantProfile);
          if(S.user)subscribeWorkerMileage(S.user.uid);

      if(S.tenantProfile.canMaintenance&&S.tenantProfile.landlordUid&&!(S.todoItems&&S.todoItems.length>=0&&S._maint_subscribed)){
        S._maint_subscribed=true;
        subscribeTodos(S.tenantProfile.landlordUid);

        var newWorkerEmail=S.tenantProfile.email.toLowerCase().trim();

          subscribeWorkerShifts(S.tenantProfile);
          subscribeWorkerBudget(S.tenantProfile);
          if(S.user)subscribeWorkerMileage(S.user.uid);
        }
      }
      if(S.tenantProfile.canPropertyManager&&S.tenantProfile.landlordUid){
        var newAp=JSON.stringify(S.tenantProfile.assignedProperties||[]);
        if(!S._mgr_subscribed||S._mgr_ap!==newAp){
          S._mgr_subscribed=true;
          S._mgr_ap=newAp;

          subscribeWorkerShifts(S.tenantProfile);
          subscribeWorkerBudget(S.tenantProfile);
          if(S.user)subscribeWorkerMileage(S.user.uid);

  subscribeTenantRequests(email);

function calcUCC(cost,rate,purchaseDate){
  if(!cost||!purchaseDate)return Number(cost)||0;
  var yrs=new Date().getFullYear()-new Date(purchaseDate).getFullYear();
  if(yrs<=0)return Number(cost)*(1-rate/100*0.5); // half-year rule year 1
  var ucc=Number(cost)*(1-rate/100*0.5); // after year 1
  for(var i=1;i<yrs;i++) ucc=ucc*(1-rate/100);
  return Math.max(0,ucc);
}

function calcMortgagePayments(d){
  // Returns {balance, nextPaymentDate, daysUntilNext}
  if(!d.lastPaymentDate||!d.principal||!d.rate||!d.payment) return null;
  var freq=d.paymentFrequency||'monthly';
  var intervalDays=freq==='biweekly'?14:30;
  var today=new Date(); today.setHours(0,0,0,0);
  var last=new Date(d.lastPaymentDate+'T00:00:00');
  if(isNaN(last.getTime())) return null;
  var balance=Number(d.principal)||0;
  var rate=Number(d.rate)||0;
  var payment=Number(d.payment)||0;
  // Count payments since lastPaymentDate
  var cursor=new Date(last);
  while(true){
    var next=new Date(cursor);
    if(freq==='biweekly'){next.setDate(next.getDate()+14);}
    else{next.setMonth(next.getMonth()+1);}
    if(next>today) break;
    var monthlyRate=rate/100/12;
    var interestPortion=balance*monthlyRate*(freq==='biweekly'?14/30:1);
    var principalPortion=Math.max(0,payment-interestPortion);
    balance=Math.max(0,balance-principalPortion);
    cursor=next;
  }
  // Next payment date
  var nextDate=new Date(cursor);
  if(freq==='biweekly'){nextDate.setDate(nextDate.getDate()+14);}
  else{nextDate.setMonth(nextDate.getMonth()+1);}
  var daysUntil=Math.round((nextDate-today)/(1000*60*60*24));
  var nextStr=nextDate.toISOString().slice(0,10);
  return {balance:Math.round(balance*100)/100,nextPaymentDate:nextStr,daysUntilNext:daysUntil};
}

  var monthlyInterest=principal*(rate/100/12);
  var annualInterest=monthlyInterest*12;
  var annualPayment=freq==='biweekly'?payment*26:payment*12;
  var rateHistory=d.rateHistory||[];
  var appraisedValue=Number(d.appraisedValue)||0;

function carryOverLockedUtils(uid){
  // Phase 3 — if all properties have utilitiesList, skip carry-over entirely
  var propsWithUtils=S.properties.filter(function(p){return p.utilitiesList&&p.utilitiesList.length>0;});
  if(propsWithUtils.length>0&&propsWithUtils.length===S.properties.length){
    // All properties migrated — carry-over no longer needed
    return;
  }
  var now=new Date();
  var curKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var f=fb();
  // Only run once per month
  f.getDoc(f.doc(f.db,'users/'+uid+'/settings/lastCarryOver')).then(function(doc){
    var lastCarry=doc&&doc.exists&&doc.exists()?doc.data().month:'';
    if(lastCarry===curKey)return;
    var prevMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
    var prevKey=prevMonth.getFullYear()+'-'+String(prevMonth.getMonth()+1).padStart(2,'0');
    f.getDocs(f.query(f.collection(f.db,'users/'+uid+'/util_'+prevKey))).then(function(prevSnap){
      var locked=prevSnap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});}).filter(function(u){return u.locked;});
      if(locked.length===0){fsSet('users/'+uid+'/settings/lastCarryOver',{month:curKey});return;}
      f.getDocs(f.query(f.collection(f.db,'users/'+uid+'/util_'+curKey))).then(function(curSnap){
        var curItems=curSnap.docs.map(function(d){return d.data();});
        var toWrite=locked.filter(function(u){
          return !curItems.some(function(c){
            return (c.name||'').toLowerCase()===(u.name||'').toLowerCase()&&(c.property||'')===(u.property||'');
          });
        });
        // Write sequentially — wait for each before firing next
        var chain=Promise.resolve();
        toWrite.forEach(function(u){
          chain=chain.then(function(){
            var newU=Object.assign({},u,{id:mkid(),date:new Date().toISOString().slice(0,10)});
            return fsSet('users/'+uid+'/util_'+curKey+'/'+newU.id,newU);
          });
        });
        chain.then(function(){
          fsSet('users/'+uid+'/settings/lastCarryOver',{month:curKey});
        });
      });
    });
  }).catch(function(){});
}
function autoResetPaidStatus(uid){
  var curKey=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  var f=fb();
  f.getDoc(f.doc(f.db,'users/'+uid+'/settings/lastPaidReset')).then(function(doc){
    var lastReset=doc&&doc.exists&&doc.exists()?doc.data().month:'';
    if(lastReset===curKey)return; // Already reset this month

function checkAndCreditBudgets(uid){
  // On login — check each worker with auto-reload enabled, credit if needed
  var f=fb();
  var today=new Date();
  var curKey=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  f.getDocs(f.query(f.collection(f.db,'users/'+uid+'/payrollBudgets'))).then(function(snap){
    snap.docs.forEach(function(d){
      var cfg=Object.assign({},d.data(),{id:d.id});
      if(!cfg.autoReload)return;
      if(cfg.lastCredited===curKey)return; // Already credited this period
      var creditDay=Number(cfg.creditDay)||1;
      if(today.getDate()<creditDay)return; // Not time yet
      // Credit the budget — add to existing balance (mirrors monthly in-trust deposit)
      var newBalance=(Number(cfg.balance)||0)+(Number(cfg.amount)||500);
      fsSet('users/'+uid+'/payrollBudgets/'+cfg.id,Object.assign({},cfg,{balance:newBalance,lastCredited:curKey}));
    });
  });
}
function deductFromBudget(workerId,amount){
  var cfg=S.payrollBudgets[workerId];
  // Fallback — try direct ID if pid lookup fails
  if(!cfg){
    var keys=Object.keys(S.payrollBudgets);
    for(var i=0;i<keys.length;i++){
      var b=S.payrollBudgets[keys[i]];
      if(b&&(keys[i]===workerId)){cfg=b;break;}
    }
  }
  if(!cfg)return;
  var newBalance=(Number(cfg.balance)||0)-amount;
  fsSet('users/'+S.user.uid+'/payrollBudgets/'+workerId,Object.assign({},cfg,{balance:newBalance}));
}

var MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function catTotal(cat){
  return (cat.items||[]).reduce(function(a,item){
    var m;
    if(item.isVariable){
      var vals=item.months||{};
      var curM=new Date().getMonth();
      var sum=0;
      for(var mi=0;mi<=curM;mi++){var k=MONTHS_SHORT[mi].toLowerCase();sum+=Number(vals[k])||0;}
      m=curM>=0?sum/(curM+1):0;
    } else {
      m=item.isAnnual?(Number(item.monthly)||0)/12:(Number(item.monthly)||0);
    }
    return a+m*(Number(item.pct)||100)/100;
  },0);
}

  S.dedCategories=(S.dedCategories||[]).map(function(c){

      if(i.id!==itemId)return i;
      if(field==='mode'){
        return Object.assign({},i,{isAnnual:val==='annual',isVariable:val==='variable'});
      }
      if(field.indexOf('month_')===0){
        var k=field.replace('month_','');
        var months=Object.assign({},i.months||{});
        months[k]=Number(val)||0;
        return Object.assign({},i,{months:months});
      }
      var u={};u[field]=val;
      return Object.assign({},i,u);
    })});
  });
  saveDeductibles();
  render();
}

function applyVendorDB(result, rawText){
  if(!S.vendorDB||!S.vendorDB.length) return result;
  // Use GST from AI response first, fall back to regex on rawText
  var gstNum=(result.gst||'').replace(/\D/g,'').slice(0,9);
  if(!gstNum){
    var gst=(rawText||'').match(/\d{9}RT\d{4}/);
    if(!gst){var hst=(rawText||'').match(/H\.?S\.?T#?\s*(\d{9})/);if(hst)gst=[hst[1]];}
    gstNum=gst?gst[0]:'';
  }
  var match=null;
  // 1. Match by GST number
  if(gstNum){var g9=gstNum.replace(/\D/g,'').slice(0,9);match=S.vendorDB.find(function(v){return (v.gst||'').replace(/\D/g,'').slice(0,9)===g9;});}
  // 2. Fallback — match by address
  if(!match){
    var vendorText=(result.vendor||'').toLowerCase()+' '+(rawText||'').toLowerCase();
    match=S.vendorDB.find(function(v){
      return v.address&&v.address.length>3&&vendorText.indexOf(v.address.toLowerCase())!==-1;
    });
  }
  // 3. Fallback — match by vendor name
  if(!match){
    var vName=(result.vendor||'').toLowerCase();
    match=S.vendorDB.find(function(v){
      return v.vendor&&v.vendor.length>3&&vName.indexOf(v.vendor.toLowerCase())!==-1;
    });
  }
  if(!match) return result;
  if(match.displayName) result.vendor=match.displayName;
  if(match.flipDate&&result.date&&result.date.match(/^\d{4}-\d{2}-\d{2}$/)){
    var parts=result.date.split('-');
    result.date=parts[0]+'-'+parts[2]+'-'+parts[1];
  }
  return result;
}

      hourlyRate:Number(tp.hourlyRate)||0,

      date:new Date().toISOString().slice(0,10),
      notes:(notes||'')+(t.text?' [Task: '+t.text+']':''),
      paid:false,
      createdAt:new Date().toISOString()
    }).catch(function(e){console.warn('Work order payroll log failed:',e);});
  }
  // Log to maintenance log
  addMaintenanceLog({
    id:mkid(),

    task:t.text,
    property:t.property||'',
    completedBy:tp.name||tp.email,

    notes:notes||'',

  });
  closeSheet();
}

function formatInviteKey(el){
  var v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  var chunks=[];
  for(var i=0;i<v.length&&i<16;i+=4) chunks.push(v.slice(i,i+4));
  S.authInviteKey=chunks.join('-');
  el.value=S.authInviteKey;
}

function doAuth(){
  var f=fb();
  var isSignup=S.authMode==='tenant';
  if(isSignup&&S.authPassword!==S.authConfirmPassword){
    S.authError='Passwords do not match!';render();return;
  }
  if(isSignup&&S.authPassword.length<6){
    S.authError='Password needs 6+ characters.';render();return;
  }
  var email=S.authEmail.trim().toLowerCase();
  if(isSignup){
    var LANDLORD_UID='192dQJClOZShp9wbdDevZUHDR922';
    var keyInput=(S.authInviteKey||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!keyInput){
      S.authError='An invite key is required. Contact your landlord.';render();return;
    }
    S.authLoading=true;S.authError='';render();
    f.getDocs(f.query(f.collection(f.db,'users/'+LANDLORD_UID+'/inviteKeys'))).then(function(snap){
      var matchKey=null;
      snap.docs.forEach(function(doc){
        var k=doc.data();
        var storedKey=(k.key||'').replace(/-/g,'');
        if(storedKey===keyInput&&!k.used) matchKey=Object.assign({},k,{id:doc.id});
      });
      if(!matchKey){
        S.authError='Invalid or already used invite key.';S.authLoading=false;render();return;
      }
      return f.createUserWithEmailAndPassword(f.auth,email,S.authPassword).then(function(cred){
        var uid=cred.user.uid;
        f.setDoc(f.doc(f.db,'users/'+LANDLORD_UID+'/pendingUsers/'+uid),{
          id:uid,uid:uid,email:email,
          name:S.authName||email.split('@')[0],
          phone:S.authPhone||'',
          keyUsed:matchKey.key,
          keyId:matchKey.id,
          keyNote:matchKey.note||'',
          createdAt:new Date().toISOString()
        });
      });
    }).then(function(){
      S.authLoading=false;S.authConfirmPassword='';S.authInviteKey='';S.authName='';S.authPhone='';
    }).catch(function(e){
      S.authError=e.code==='auth/email-already-in-use'?'Email already registered.':e.code==='auth/weak-password'?'Password needs 6+ characters.':e.message||'Signup failed.';
      S.authLoading=false;render();
    });
    return;
  }
  // Login flow — unchanged
  S.authLoading=true;S.authError='';render();
  f.signInWithEmailAndPassword(f.auth,email,S.authPassword)
    .then(function(){S.authLoading=false;S.authConfirmPassword='';})
    .catch(function(e){
      S.authError=e.code==='auth/invalid-credential'?'Incorrect email or password.':e.code==='auth/email-already-in-use'?'Email already registered.':e.code==='auth/weak-password'?'Password needs 6+ characters.':e.message;
      S.authLoading=false;render();
    });
}

function handleFileScan(file){
  if(!file||!file.type.startsWith('image/')){S.scanError='Please upload an image.';render();return;}
  S.scanError='';S.scanning=true;S.quickMode=false;if(!S.vendorDBScanMode)S.tab='receipts';render();
  var previewUrl=URL.createObjectURL(file);
  // Compress image to stay under 5MB API limit
  var img=new Image();
  img.onload=function(){
    var canvas=document.createElement('canvas');
    var maxDim=2048;
    var w=img.width,h=img.height;
    if(w>maxDim||h>maxDim){var scale=maxDim/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale);}
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    var quality=0.85;
    var dataUrl=canvas.toDataURL('image/jpeg',quality);
    // If still too big, compress more
    if(dataUrl.length*0.75>4500000){dataUrl=canvas.toDataURL('image/jpeg',0.65);}
    var base64=dataUrl.split(',')[1];
    var prompt='Analyze this receipt image. Respond ONLY with valid JSON, no markdown, no explanation: {"vendor":"store name","seller":"third-party seller name or empty string","date":"YYYY-MM-DD","total":number,"category":"one of: Repairs & Maintenance, Utilities, Insurance, Property Tax, Supplies, Landscaping, Cleaning, Business Meals, Other","items":["item1"],"confidence":"high|medium|low","gst":"business registration number from receipt (GST/HST number, digits only) or empty string if not found"}. AMAZON RULE: If the receipt shows amazon.ca, amazon.com, an Amazon logo, or an order number formatted like 702-XXXXXXX-XXXXXXX, set "vendor" to exactly "Amazon". Then read the "Sold by / Vendu par" line: if the seller there is NOT Amazon (a third-party marketplace seller), put that seller name in "seller"; if it is sold by Amazon directly, leave "seller" empty. For every non-Amazon receipt, leave "seller" empty. IMPORTANT date rules: Always output date as YYYY-MM-DD, and use ONLY the transaction/purchase date (when the sale happened). IGNORE every other date on the receipt such as survey deadlines, contest end dates, return or exchange windows, valid-until dates, and last-day-to dates. If the transaction date has a spelled-out month (e.g. 06 April 2026 means April 6), trust that over a numeric date. If year is 2-digit like 26 expand to 2026. If date is ambiguous use store location — Canadian stores use DD/MM/YYYY, US stores use MM/DD/YYYY. If still uncertain prefer DD/MM/YYYY for Canadian receipts. If not a receipt set total to 0.';
    var reqBody=JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:base64}},{type:'text',text:prompt}]}]});
    fetch(WORKER_URL+'/',{method:'POST',headers:{'Content-Type':'application/json'},body:reqBody})
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data||!data.content||!Array.isArray(data.content)){console.warn('[SCAN] Bad response:',JSON.stringify(data));S.scanError='Scan failed — please try again.';S.scanning=false;render();return;}
      var txt=data.content.map(function(b){return b.text||'';}).join('').replace(/```json|```/g,'').trim();
      var clean=txt.replace(/[\u0000-\u001F\u007F-\u009F]/g,'').replace(/[^\x20-\x7E\xA0-\uFFFF]/g,'').trim();
      var result;try{result=JSON.parse(clean);}catch(e){S.scanError='Could not read receipt — try a clearer photo.';S.scanning=false;render();return;}
      if(!result||typeof result!=='object'){S.scanError='Could not read receipt — try a clearer photo.';S.scanning=false;render();return;}
      // Apply vendor database (GST-based corrections take priority)
      result=applyVendorDB(result, clean);
      // Apply vendor alias map (legacy fallback)
      if(S.vendorAliases&&S.vendorAliases.length>0){
        var vendorCheck=(result.vendor||'').toLowerCase();
        var fullCheck=vendorCheck+'|'+clean.toLowerCase();
        S.vendorAliases.forEach(function(a){
          if(fullCheck.indexOf(a.trigger.toLowerCase())!==-1){
            result.vendor=a.name;
            if(a.flipDate&&result.date&&result.date.match(/^\d{4}-\d{2}-\d{2}$/)){
              var parts=result.date.split('-');
              result.date=parts[0]+'-'+parts[2]+'-'+parts[1];
            }
          }
        });
      }
      // Fix 2-digit year (e.g. 21/04/21 -> 2026-04-21)
      if(result.date){
        var curFullYear=new Date().getFullYear();
        // Handle YYYY-MM-DD with 2-digit year like 21-04-21
        result.date=result.date.replace(/^(\d{2})-(\d{2})-(\d{2})$/,function(m,y,mo,d){
          return curFullYear+'-'+mo+'-'+d;
        });
        // Handle 2-digit year in first position of any format
        result.date=result.date.replace(/^(\d{2})\/(\d{2})\/(\d{2})$/,function(m,d,mo,y){
          return curFullYear+'-'+mo+'-'+d;
        });
        // If year portion is clearly 2-digit (e.g. 2021 scanned as 21)
        var yearMatch=result.date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if(yearMatch&&Number(yearMatch[1])<100){
          result.date=curFullYear+'-'+yearMatch[2]+'-'+yearMatch[3];
        }
      }
      var r={id:mkid(),fileName:file.name,previewUrl:previewUrl,vendor:result.vendor||'Unknown',seller:result.seller||'',date:result.date||new Date().toISOString().slice(0,10),total:Number(result.total)||0,category:result.category||'Other',property:S.properties.length>0?S.properties[0].name:'all',expType:'operating',items:result.items||[],confidence:result.confidence||'low'};
      _pendingScanFile=file;
      // Check for duplicate — skip if scanning to vendor database
      var dupCheck=!S.vendorDBScanMode&&S.receipts.find(function(x){
        return x.vendor&&r.vendor&&x.vendor.toLowerCase()===r.vendor.toLowerCase()
          && Math.abs(Number(x.total)-Number(r.total))<0.01
          && x.date===r.date;
      });
      if(dupCheck){
        S.scanning=false;
        S._pendingDupReceipt=r;
        S.scanError='';
        render();
        if(confirm('Possible duplicate: '+r.vendor+' $'+r.total+' on '+r.date+' already exists.\nScan anyway?')){
          openSheet('confirmScan',Object.assign({},r));
        } else {
          _pendingScanFile=null;
          S._pendingDupReceipt=null;
        }
        return;
      }
      // If scanning to vendor database, show vendor entry sheet instead of receipt confirm
      if(S.vendorDBScanMode){
        var gstNum=(result.gst||'').replace(/\D/g,'').slice(0,9);
        if(!gstNum){var gstM=clean.match(/\d{9}RT\d{4}/);if(!gstM){var hstM=clean.match(/H\.?S\.?T#?\s*(\d{9})/);if(hstM)gstM=[hstM[1]];}gstNum=gstM?gstM[0]:'';}gstNum=(gstNum||'').replace(/\D/g,'').slice(0,9);
        
        S.vendorDBScanMode=false;
        S.scanning=false;
        openSheet('addVendorDB',{
          id:gstNum||mkid(),
          gst:gstNum,
          vendor:result.vendor||'',
          displayName:result.vendor||'',
          flipDate:false,
          rawDate:result.date||'',
        });
        return;
      }
      openSheet('confirmScan',Object.assign({},r));
    })
    .catch(function(e){var msg=e&&e.message?e.message:String(e);S.scanError='Scan error: '+msg.slice(0,80);console.error('Scanner error:',e);})
    .finally(function(){S.scanning=false;render();});
  };
  img.src=URL.createObjectURL(file);
}

  var scrollEl=document.querySelector('.scroll');
  var scrollTop=scrollEl?scrollEl.scrollTop:0;

  console.log('[RENDER] tab:',S.tab,'quickMode:',S.quickMode,'isTenant:',S.isTenant,'isPartner:',S.isPartner);

  // 6th of month reminder
  if(!S.isTenant&&S.user){
    var today=new Date();
    if(today.getDate()===6){
      var reminderKey='rentReminderShown_'+today.getFullYear()+'_'+today.getMonth();
      if(!localStorage.getItem(reminderKey)){
        localStorage.setItem(reminderKey,'1');
        var unpaid=S.tenants.filter(function(t){return !t.paid;});
        if(unpaid.length>0){
          setTimeout(function(){
            alert('🗓️ It\'s the 6th! You have '+unpaid.length+' unpaid tenant'+(unpaid.length===1?'':'s')+'. Consider sending rent reminders!');

        }

    }
  }

  if(!S.authReady){
    root.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6366f1;font-family:Nunito,sans-serif;font-size:18px;font-weight:700">Loading RellikRentals...</div>';
    return;
  }

  if(!S.user){
    var isSignup=S.authMode==='tenant';
    root.innerHTML='<div class="auth-wrap">'
      +'<div style="font-size:32px;font-weight:900;margin-bottom:4px;letter-spacing:-1px">RellikRentals</div>'

function showSplash(){
  S.splashDone=true;
  var el=document.createElement('div');
  el.id='splash';

  // Build tunnel scene
  var colors=['#ff00ff','#00ffff','#ffff00','#ff6600','#00ff88','#ff0088'];
  var cobbleRows='';
  for(var r=0;r<12;r++){
    var scale=0.3+r*0.06;
    var yPos=28+r*7;
    var h=Math.max(8,r*5);
    var cobbles='';
    var count=3+Math.floor(r/2);
    for(var c=0;c<count;c++){
      var hue=Math.round((r*30+c*15)%360);
      cobbles+='<div class="cobble" style="height:'+h+'px;background:hsl('+hue+',40%,'+(10+r*3)+'%);"></div>';
    }
    cobbleRows+='<div class="cobble-row" style="bottom:'+yPos+'%;left:'+(50-scale*50)+'%;width:'+(scale*100)+'%;gap:'+(scale*3)+'px">'+cobbles+'</div>';
  }

  // Mushrooms left and right
  var mushHTML='';
  var mushData=[
    {side:'left',x:8,size:0.7,color:'#ff00ff',glow:'#ff00ff'},
    {side:'left',x:18,size:0.4,color:'#00ffff',glow:'#00ffff'},
    {side:'right',x:8,size:0.7,color:'#ffff00',glow:'#ffff00'},
    {side:'right',x:18,size:0.45,color:'#ff6600',glow:'#ff6600'},
    {side:'left',x:30,size:0.3,color:'#00ff88',glow:'#00ff88'},
    {side:'right',x:30,size:0.35,color:'#ff0088',glow:'#ff0088'},
  ];
  mushData.forEach(function(m){
    var xPos=m.side==='left'?m.x+'%':(100-m.x-8)+'%';
    var capW=Math.round(60*m.size);
    var capH=Math.round(35*m.size);
    var stemH=Math.round(30*m.size);
    var stemW=Math.round(12*m.size);
    var dots='';
    for(var d=0;d<3;d++){
      dots+='<div style="position:absolute;width:'+Math.round(6*m.size)+'px;height:'+Math.round(6*m.size)+'px;background:rgba(255,255,255,0.8);border-radius:50%;top:'+(20+d*20)+'%;left:'+(15+d*25)+'%"></div>';
    }
    mushHTML+='<div class="mushroom" style="left:'+xPos+';bottom:36%">'
      +'<div class="mush-cap" style="width:'+capW+'px;height:'+capH+'px;background:'+m.color+';box-shadow:0 0 '+Math.round(20*m.size)+'px '+m.glow+';position:relative">'+dots+'</div>'
      +'<div class="mush-stem" style="width:'+stemW+'px;height:'+stemH+'px"></div>'
      +'</div>';
  });

  // Door
  var doorHTML='<div class="door-frame" id="splashDoor" style="width:80px;height:110px;bottom:38%;border-color:#8b5cf6;box-shadow:0 0 30px #8b5cf6,0 0 60px #6366f1;background:#1a0a2e;">'
    +'<div class="door-panel" id="splashDoorPanel" style="background:linear-gradient(135deg,#2a1a4e,#1a0a2e);border:2px solid #6366f1">'
    +'<div style="width:8px;height:8px;background:#fbbf24;border-radius:50%;position:absolute;right:8px;top:50%;box-shadow:0 0 8px #fbbf24"></div>'
    +'</div>'
    +'</div>';

  // Welcome text
  var welcomeHTML='<div class="welcome-text" id="splashWelcome" style="font-size:clamp(16px,4vw,28px);top:38%;max-width:70%;letter-spacing:2px">Welcome Home</div>';

  // Skip button
  var skipHTML='<button class="skip-btn" onclick="skipSplash()">Skip ›</button>';

  el.innerHTML='<div class="tunnel-wrap" id="tunnelWrap" style="animation:tunnelPulse 3s infinite">'
    +'<div style="position:absolute;inset:0;background:linear-gradient(to bottom,#0a0812 0%,#1a0a2e 40%,#0a0812 100%)"></div>'
    +'<div class="tunnel-floor">'+cobbleRows+'</div>'
    +mushHTML
    +doorHTML
    +welcomeHTML
    +skipHTML
    +'</div>';

  document.body.appendChild(el);

  // Animation sequence
  var t1=setTimeout(function(){
    // Tunnel zooms in toward door
    document.getElementById('tunnelWrap').style.animation='tunnelZoom 3.6s ease-in forwards, tunnelPulse 3s infinite';
  },360);

  var t2=setTimeout(function(){
    // Door swings open
    var panel=document.getElementById('splashDoorPanel');
    if(panel) panel.style.animation='doorSwing 0.8s ease-in-out forwards';
  },4820);

  var t3=setTimeout(function(){
    // Welcome text fades in
    var w=document.getElementById('splashWelcome');
    if(w) w.style.animation='welcomeFade 1s ease-out forwards';
  },3600);

  var t4=setTimeout(function(){
    // Create a black oval that expands from the door opening — rush through effect
    var door=document.getElementById('splashDoor');
    var overlay=document.createElement('div');
    overlay.style.cssText='position:absolute;background:#0a0812;border-radius:50%;width:60px;height:80px;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);transition:transform 0.7s ease-in, border-radius 0.7s ease-in;z-index:5;';
    el.appendChild(overlay);
    setTimeout(function(){overlay.style.transform='translate(-50%,-50%) scale(40)';overlay.style.borderRadius='0';},50);
    setTimeout(function(){
      if(el&&el.parentNode)el.parentNode.removeChild(el);
      render();
    },750);
  },6600);

  window._splashTimers=[t1,t2,t3,t4];
}

function skipSplash(){
  if(window._splashTimers) window._splashTimers.forEach(clearTimeout);
  var el=document.getElementById('splash');
  if(el&&el.parentNode) el.parentNode.removeChild(el);
  render();
}

        if(wasLoggedOut&&!S.splashDone) S._pendingSplash=true;

        loadPartnerOwnPrefs(user.uid);

        S._pendingAuthUser=user;
        S._pendingWasLoggedOut=wasLoggedOut;
        root.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6366f1;font-family:Nunito,sans-serif;font-size:18px;font-weight:700">Loading...</div>';

        console.warn('[AUTH] Fell to tenant path. partnerEmail:',S.partnerEmail,'userEmail:',user.email,'loaded:',S._partnerSettingsLoaded);
        if(wasLoggedOut&&!S.splashDone) S._pendingSplash=true;
        S.isTenant=true;
        var f2=fb();
        var tpRef=f2.doc(f2.db,'tenantProfiles/'+pid(user.email.toLowerCase()));
        f2.setDoc(tpRef,{uid:user.uid},{merge:true}).catch(function(e){console.warn('UID write failed:',e);});
        var miRef=f2.doc(f2.db,'managerIndex/'+user.uid);
        f2.getDoc(miRef).then(function(snap){
          if(snap.exists()){
            f2.setDoc(miRef,{uid:user.uid},{merge:true}).catch(function(e){console.warn('managerIndex update failed:',e);});
          }
        }).catch(function(){});
        subscribeTenantPortal(user.email.toLowerCase());
        if(S._pendingSplash&&!S.splashDone){S._pendingSplash=false;showSplash();}
      }
      initNotifications();
    }else{
      S.isTenant=false; S.tenantProfile=null;
    }
    render();
  });
}

function initNotifications(){
  if(!('serviceWorker' in navigator)||!('Notification' in window))return;
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    var f=fb();
    var messaging=f.fcmMessaging;
    _messaging=messaging;
    f.onMessage(messaging,function(payload){
      var title=payload.notification?.title||'RellikRentals';
      var body=payload.notification?.body||'';
      if(Notification.permission==='granted'){
        new Notification(title,{body:body});
      }
    });
    // Wait for service worker to be active
    var sw=reg.installing||reg.waiting||reg.active;
    var doToken=function(){
      if(Notification.permission==='default'){
        Notification.requestPermission().then(function(perm){
          if(perm==='granted') getFCMToken(reg,messaging);
        });
      } else if(Notification.permission==='granted'){
        getFCMToken(reg,messaging);
      }
    };
    if(reg.active){
      doToken();
    } else {
      sw.addEventListener('statechange',function(e){
        if(e.target.state==='activated') doToken();
      });
    }
  }).catch(function(e){console.log('SW registration failed:',e);});
}

function getFCMToken(reg,messaging){
  var f=fb();
  f.getToken(messaging,{vapidKey:window.VAPID_KEY,serviceWorkerRegistration:reg}).then(function(token){
    if(token&&S.user){
      var uid=S.isTenant?(S.tenantProfile?S.tenantProfile.id:S.user.uid):S.user.uid;
      var path=S.isTenant?'tenantProfiles/'+uid:'users/'+uid;
      f.setDoc(f.doc(f.db,path+'/fcmTokens/'+token.slice(-20)),{token:token,updated:new Date().toISOString()},{merge:true}).catch(function(){});
    }
  }).catch(function(e){console.log('FCM error:',e.message);});
}

function sendPushNotification(toUid, isTenantTarget, title, body, tag){
  // Write notification request to Firestore — Cloudflare Worker picks it up
  var f=fb();
  var notifId=mkid();
  f.setDoc(f.doc(f.db,'notificationQueue/'+notifId),{
    toUid:toUid,
    isTenant:isTenantTarget,
    title:title,
    body:body,
    tag:tag||'rellikrentals',
    createdAt:new Date().toISOString(),
    sent:false
  }).catch(function(){});
}

if(window._fb){initApp();}else{window.addEventListener('fbReady',initApp);}

</script>
